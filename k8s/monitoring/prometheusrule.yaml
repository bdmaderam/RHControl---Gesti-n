# Alertas básicas (visibles en Prometheus > Alerts).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rhcontrol
  namespace: rhcontrol
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: rhcontrol-api
      rules:
        - alert: RHControlAPICaida
          expr: absent(up{job="backend", namespace="rhcontrol"} == 1)
          for: 1m
          labels: {severity: critical}
          annotations: {summary: "Ninguna réplica de la API responde al scraping"}
        - alert: RHControlErroresAltos
          expr: sum(rate(http_requests_total{status=~"5.."}[1m])) / sum(rate(http_requests_total[1m])) > 0.2
          for: 1m
          labels: {severity: warning}
          annotations: {summary: "Más del 20 % de las respuestas son errores 5xx"}
        - alert: RHControlLatenciaAlta
          expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[1m]))) > 1
          for: 2m
          labels: {severity: warning}
          annotations: {summary: "La latencia p95 de la API supera 1 s"}
