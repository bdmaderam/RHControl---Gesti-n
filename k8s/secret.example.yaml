# PLANTILLA de Secret. NO pongas valores reales aquí ni subas el archivo copiado al repositorio.
#   cp k8s/secret.example.yaml k8s/secret.yaml   # secret.yaml está en .gitignore
#   (edita los valores)  ->  kubectl apply -f k8s/secret.yaml
# O genera todo con valores aleatorios:  ./scripts/k8s-crear-secret.sh
#
# DATABASE_URL debe usar el mismo usuario y contraseña que POSTGRES_USER / POSTGRES_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: rhcontrol-secret
  namespace: rhcontrol
type: Opaque
stringData:
  POSTGRES_USER: rhcontrol
  POSTGRES_PASSWORD: CAMBIAR_contraseña_de_la_base
  DATABASE_URL: postgresql+psycopg://rhcontrol:CAMBIAR_contraseña_de_la_base@postgres:5432/rhcontrol
  JWT_SECRET: CAMBIAR_llave_de_firma_de_al_menos_16_caracteres   # firma de los tokens JWT
  ADMIN_PASSWORD: CAMBIAR_contraseña_del_usuario_admin           # usuario inicial "admin"
  # Si algún día se usa una API de LLM con costo, su clave también va aquí (nunca en el código):
  # LLM_API_KEY: CAMBIAR
