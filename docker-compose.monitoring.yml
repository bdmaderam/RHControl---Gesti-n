# Prometheus + Grafana locales, para usar junto al docker-compose.yml principal:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up --build -d
# Prometheus: http://localhost:9090   Grafana: http://localhost:3001 (usuario admin; clave GRAFANA_PASSWORD, por defecto "admin")
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: rhcontrol-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.3.1
    container_name: rhcontrol-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./k8s/monitoring/dashboards:/var/lib/grafana/dashboards:ro   # el mismo dashboard que usa Kubernetes
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
