services:
  db:
    image: postgres:16-alpine
    container_name: rhcontrol-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rhcontrol
      POSTGRES_USER: rhcontrol
      POSTGRES_PASSWORD: rhcontrol
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhcontrol -d rhcontrol"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: rhcontrol-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://rhcontrol:rhcontrol@db:5432/rhcontrol
      JWT_SECRET: ${JWT_SECRET:-clave-local-rhcontrol-cambiar-en-produccion}
      CORS_ORIGINS: http://localhost:3000,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8000/api
    container_name: rhcontrol-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
